# preprocess_ugmrt.cfg  –  configuration for the uGMRT bandpass workflow.
#
# This file is Python syntax: Path(), tuples, dicts, booleans all work as-is.
# It is exec'd by preprocess_ugmrt.py at startup; do NOT import anything that
# is not in the Python standard library.
#
# Reload the workflow after editing this file:
#   ./run_preprocess.sh --step all --iter-tag iter01

from pathlib import Path

# ── Paths ──────────────────────────────────────────────────────────────────────
BASE_DIR = Path('/Users/raj030/DATA/gmrt_40_014')
WORK_DIR = BASE_DIR / 'work'
DATA_DIR = BASE_DIR / 'data'

CAL_FITS            = DATA_DIR / '40_014_25jul2021_gsb.FITS'
# INDEX_CACHE is derived automatically from CAL_FITS:
#   <WORK_DIR>/<cal_fits_stem>.index.npz
# Override by setting INDEX_CACHE explicitly here if you need a custom path.

# ── Source (must be defined before output paths below) ─────────────────────────
SOURCE         = '3C48'

# ── Output paths (derived from SOURCE so switching calibrator is one edit) ─────
_src = SOURCE.lower()
BANDPASS_OUT        = WORK_DIR / f'{_src}_bandpass_25jul_gsb.npz'
DIAG_PLOT_BASE      = WORK_DIR / f'{_src}_bandpass_diagnostics.png'
DIAG_PLOT_UNFLAGGED = WORK_DIR / f'{_src}_bandpass_diagnostics_unflagged.png'

# Row-index cache validation mode: 'fast' | 'fast+sha' | 'sha256' | 'none'
INDEX_VALIDATION_MODE = 'fast+sha'

# ── Known non-functional (dud) antennas ───────────────────────────────────────
# These antenna names are excluded from all row-index counts, baseline
# statistics, and sensitivity formulae.  Prefix matching is used: 'C07'
# matches the AN table entry 'C07:31', 'S05' matches 'S05:32', etc.
#
# WHY these two: C07 (antenna_no=31) and S05 (antenna_no=32) have ghost
# STABXYZ entries in the AIPS AN table — their recorded positions are
# identical to W06 (~1 m apart) rather than their actual locations.  They
# are not real working antennas in this dataset.
#
# HOW TO RESET: if GMRT ever commissions these antennas for real, set:
#   DUD_ANTENNA_NAMES = []
# to disable all name-based overrides (auto-detection via zero-STABXYZ
# magnitude will still run as a safety net).
DUD_ANTENNA_NAMES = ['C07', 'S05']

# Flag tables merged on-the-fly on every solve/diagnostic pass.
# Files that do not exist on disk are silently skipped.
FLAG_TABLE_BASE    = WORK_DIR / f'{_src}_flag_table.json'
FLAG_TABLE_SESSION = WORK_DIR / f'{_src}_flag_table_session.json'
FLAG_TABLE_PATHS   = [p for p in [FLAG_TABLE_BASE, FLAG_TABLE_SESSION] if p.exists()]

# ── Solve parameters ───────────────────────────────────────────────────────────
STOKES         = ('RR', 'LL')
CHAN_RANGE      = (64, 191)     # inclusive channel indices into the FITS file
MAX_ROWS_SOLVE  = 150_000
SMOOTH_WINDOW   = 5
MIN_BASELINES   = 20
ITER_TAG        = 'iter00'     # default tag; overridden by --iter-tag on the CLI

# Per-sample flag symmetrisation across correlations at load time.
# If any correlation is natively flagged at (row, chan) all are forced flagged.
FLAG_ALL_CORRS_IF_ANY_RAWVIS_FLAGGED = True

# ── Data selection (applied at load time to EVERY solve and diagnostic pass) ──
# These are passed to DataSelection and filter the visibility rows used for
# bandpass solving and diagnostics.  Set to None to disable each filter.
#
# Restrict by elevation (degrees above horizon):
#   SOLVE_ELEVATION_MIN_DEG = 25.0   # discard low-elevation data
SOLVE_ELEVATION_MIN_DEG = None
SOLVE_ELEVATION_MAX_DEG = None

# Restrict by UV-baseline length (metres):
#   SOLVE_UVRANGE_M = (200.0, 50_000.0)  # metres
SOLVE_UVRANGE_M = None

# Restrict by UV-baseline length (kilolambda, referenced to band centre):
#   SOLVE_UVRANGE_KLAMBDA = (2.0, 50.0)
SOLVE_UVRANGE_KLAMBDA = None

# Restrict by UTC time:
#   SOLVE_TIMERANGE = ('2021-07-25 19:00:00', '2021-07-25 23:00:00')
SOLVE_TIMERANGE = None

# ── Diagnostics parameters ─────────────────────────────────────────────────────
DIAG_APPLY_FLAGS_ON_THE_FLY    = True
DIAG_SAVE_UNFLAGGED_COMPARISON = False
EXCLUDE_FOR_PLOTS  = []
SKIP_EDGE_CHANNELS = (0, 0)
TOP_N              = 12
MAX_ROWS_DIAG      = 60_000

# ── Outlier scoring ────────────────────────────────────────────────────────────
# 'RR' / 'LL' – model residuals (requires registered calibrator, e.g. 3C48).
# 'V'          – |RR − LL| Stokes-V proxy (model-free, works for any source).
# A single string or a tuple of any combination of the above.
OUTLIER_METRIC = ('RR', 'LL', 'V')

# How to combine scores when multiple metrics are given:
#   'union'        → flag if threshold exceeded in ANY metric  (recommended)
#   'intersection' → flag only if threshold exceeded in ALL metrics
OUTLIER_METRIC_MERGE_STRATEGY = 'union'

# Thresholds per metric (Jy).  A plain float applies the same value to every
# active metric; a dict maps metric name → threshold.
ANTENNA_FLAG_THRESHOLD_JY  = {'RR': 180.0, 'LL': 180.0, 'V': 30.0}
BASELINE_FLAG_THRESHOLD_JY = {'RR': 800.0, 'LL': 800.0, 'V': 150.0}

# ── Flag proposal parameters ───────────────────────────────────────────────────
# What to flag each iteration: 'antennas' | 'baselines' | 'both'
FLAG_WHAT_TO_FLAG    = 'baselines'
MAX_ANTENNAS_TO_FLAG = 1
MAX_BASELINES_TO_FLAG = 6

# ── Auto-iteration parameters ──────────────────────────────────────────────────
AUTO_N_ITERS     = 10
AUTO_START_ITER  = 1
AUTO_ITER_PREFIX = 'iter'
AUTO_ITER_WIDTH  = 2            # 2 → iter01, 3 → iter001

# ── Convergence early-stopping ─────────────────────────────────────────────────
# C1 (flag set unchanged between iterations) is always active.
#
# Epsilon-based criteria (C3, C4) are active when CONVERGENCE_EPSILON > 0.
# Each tracks |RMS(i-1) - RMS(i)| / RMS(i-1) and fires when < epsilon.
#
# C3  ('V')     coherent Re⟨RR−LL⟩ rms at the phase centre (model-free)
# C4  ('Model') RR and LL model-residual rms — both pols must stall.
#               Silently skipped if no PB2017 flux model is registered.
#
# Set CONVERGENCE_EPSILON = 0.0 to disable all epsilon criteria.
CONVERGENCE_EPSILON              = 0.01   # 1% fractional change threshold
CONVERGENCE_MIN_ITERS            = 3      # minimum iters before C3/C4 are evaluated

# Which spectral rms metrics to track for convergence.
# Subset of ['V', 'Model']; set to [] to disable all epsilon criteria.
COMPARE_METRICS_FOR_CONVERGENCE  = ['V', 'Model']

# How to combine multiple active criteria:
#   'any'  — stop if ANY criterion fires  (less conservative, faster)
#   'all'  — stop only if ALL criteria fire in the same iteration (more conservative)
CONVERGENCE_COMBINE_STRATEGY     = 'any'

# Run a raw-visibility diagnostic (no bandpass correction) before iter01, tagged
# iter00.  Shows uncorrected Stokes-V and RR/LL vs model as a pre-treatment baseline.
# Set to False to skip (saves time if you only care about corrected iterations).
RUN_ITER0_DIAGNOSTIC             = True

# ── Output plots ───────────────────────────────────────────────────────────────
# DIAG_PLOT_BASE  : per-iteration diagnostic overview (spectrum, residuals, bar charts)
# GAIN_PLOT_BASE  : per-iteration 6×5 amp/phase grid of all antenna bandpass solutions
#                   Set to None to skip the gain grid plot.
GAIN_PLOT_BASE = WORK_DIR / f'{_src}_bandpass_gains.png'

# ── Logging ────────────────────────────────────────────────────────────────────
# Console + file logging level.  Overridden by --log-level on the CLI.
# Valid values: DEBUG | INFO | WARNING | ERROR
LOG_LEVEL = 'INFO'

# ── Dry-run defaults ───────────────────────────────────────────────────────────
# These are the fallback defaults when --no-dry-run is NOT passed on the CLI.
# The CLI flag always wins, so you can also leave these True and rely on
# --no-dry-run to activate writes.
DRY_RUN_BANDPASS   = True
DRY_RUN_FLAG_WRITE = True

# ── Final clustering stage (post-convergence, optional) ───────────────────────
#
# When RUN_FINAL_CLUSTERING = True the automated workflow runs one extra step
# AFTER the residual-based iteration loop has converged (C1 or epsilon stop).
# At that point the bandpass solution and the accumulated flags are already in
# memory; only the final corrected vis load is needed.
#
# What it does:
#   1. Loads corrected vis (residual-loop final flags applied, bandpass applied).
#   2. Runs outlier_detection.run_clustering_detection on every channel.
#   3. Union-merges all per-channel proposals into one flag table.
#   4. Writes the new flags to FLAG_TABLE_SESSION (unless DRY_RUN_FLAG_WRITE).
#   5. Derives a final bandpass solution with those flags active.
#   6. Saves a final diagnostic plot tagged '{AUTO_ITER_PREFIX}final_clustering'.
#
# The clustering step is skipped (with a warning) if the loop did NOT converge
# before exhausting AUTO_N_ITERS — increase AUTO_N_ITERS or lower
# CONVERGENCE_EPSILON first.
#
# CLUSTERING_CORR
#   Which correlator(s) to use as the detection statistic.  'V' (|RR-LL|/2) is
#   the recommended default — it is model-free, suppresses the source signal,
#   and is sensitive to circularly polarised RFI that survives the residual
#   flagger.  Options: same as DETECTION_CORR in outlier_detection.py.
#   Multi-corr: set to a list, e.g. ['V', 'RR', 'LL'].  Flag tables are
#   unioned across all corrs before writing.
#
# CLUSTERING_THRESHOLD_JY
#   Upper amplitude threshold — samples *above* this are marked bad.
#   5 Jy is conservative for 300-MHz band data (~44 Jy calibrator, ~30 ant
#   array).  Lower to ~1-2 Jy after good residual flagging.
#   Per-corr dict: {'V': 8.0, 'RR': 500.0, 'LL': 500.0}. Scalar applies to all.
#
# CLUSTERING_THRESHOLD_LOW_JY
#   Lower amplitude threshold — samples *below* this are also marked bad.
#   Intended for catching dead or low-gain antennas on RR/LL.  Not meaningful
#   for Stokes-V (which is ~0 for clean data).  None = disabled (default).
#   Per-corr dict: {'RR': 0.5, 'LL': 0.5}. Scalar applies to all corrs.
#
# Clustering geometry parameters (WHOLE_SCAN_BAD_FRACTION etc.) are ported
# from the Fortran my_uvflg.f thresholds.  Start with the defaults and only
# adjust CLUSTERING_MIN_CLUSTER_FRACTION if you are getting too many or too
# few wholesale (all-time) flags relative to time-range-only flags.
RUN_FINAL_CLUSTERING                      = False    # set True to activate

CLUSTERING_CORR                           = 'V'      # or ['V', 'RR', 'LL'] for multi-corr
CLUSTERING_THRESHOLD_JY                   = 5.0      # lower (1-2) after good residual flagging; or {'V':8., 'RR':500.}
CLUSTERING_THRESHOLD_LOW_JY               = None     # e.g. {'RR': 0.5, 'LL': 0.5} to catch dead antennas

# geometry thresholds — start with defaults, adjust CLUSTERING_MIN_CLUSTER_FRACTION first
CLUSTERING_MIN_CLUSTER_FRACTION           = 0.80     # fraction of obs bad → wholesale flag
CLUSTERING_GLOBAL_ANT_FLAG_FRACTION       = None     # if set (e.g. 0.80), wholesale-flag antenna when bad-cell fraction over all rows×channels exceeds threshold
CLUSTERING_MIN_DISTINCT_BASELINES_FOR_ANT = 3        # baselines bad to condemn antenna
CLUSTERING_MIN_BURST_BASELINE_FRACTION    = 0.50     # burst: fraction of active bls bad

# Fortran-tier thresholds (per-scan)
CLUSTERING_WHOLE_SCAN_BAD_FRACTION        = 0.70
CLUSTERING_PER_SCAN_ANT_FRACTION          = 0.60
CLUSTERING_PER_SCAN_ANT_BL_FRACTION       = 0.50
CLUSTERING_BASELINE_MAX_BAD_SAMPLES       = 100      # None to disable absolute-count backstop

# time-gap merging
CLUSTERING_MAX_GAP_SAMPLES                = 2        # integration periods
CLUSTERING_MAX_GAP_MINUTES                = 30.0     # calendar floor for gap merging
CLUSTERING_SCAN_GAP_MINUTES               = 2.0      # minimum gap that separates scans
